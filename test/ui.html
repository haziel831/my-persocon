<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/renderer/style.css" />
    <link rel="stylesheet" href="/src/renderer/fun.css" />
    <link rel="stylesheet" href="/src/renderer/machines.css" />
    <link rel="stylesheet" href="/src/renderer/intro.css" />
    <script type="importmap">{ "imports": { "three": "/src/renderer/vendor/three.module.js" } }</script>
    <style>body { background: linear-gradient(#4a6d94, #22344d) !important; }</style>
  </head>
  <body>
    <canvas id="debug"></canvas>
    <canvas id="pet"></canvas>
    <script type="module">
      // Browser harness: fakes the Tauri host so the renderer UI can be exercised without the desktop.
      const EMOTICONS = ['!', 'lv', 'ani_heh', 'omg', 'ani_slur', 'dotdotdot', 'hmm', 'go', 'ok', 'ani_yawn', 'help', 'wah'];
      const listeners = {};
      const toDataUrl = async (url) => {
        const blob = await (await fetch(url)).blob();
        return new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); });
      };
      const ownModel = { my: 'MyPersocon', aghata: 'Aghata' }[new URLSearchParams(location.search).get('model')];
      const loadKurumi = async () => ownModel ? {
        geometry: await (await fetch(`/models/${ownModel}/main.json`)).json(),
        animations: [await (await fetch(`/models/${ownModel}/main.animation.json`)).json()],
        texture: await toDataUrl(`/models/${ownModel}/texture.png`),
      } : ({
        geometry: await (await fetch('/DaL_Kurumi/main.json')).json(),
        animations: [await (await fetch('/DaL_Kurumi/main.animation.json')).json(), await (await fetch('/DaL_Kurumi/extra.animation.json')).json()],
        texture: await toDataUrl('/DaL_Kurumi/texture.png'),
      });
      const config = { name: 'Kurumi', modelDir: 'DaL_Kurumi', petHeight: 110, walkSpeed: 0.5, runSpeed: 1.4, climbSpeed: 0.5, gravity: 16, jumpReach: 1.6,
        climbChance: 0.6, emotes: ['extra0', 'extra1', 'extra2'], emoticons: true, emoticonRate: 1, debug: false, spawnX: 400 };
      { const q = new URLSearchParams(location.search); if (q.get('lang')) config.lang = q.get('lang'); if (q.get('pname')) config.name = q.get('pname'); if (q.get('spawn')) config.spawnX = Number(q.get('spawn')); }
      window.__calls = [];
      window.__PET_TEST__ = true;
      // ?do=soak: virtual clock, so hours of the real loop (pet.js step) run in minutes.
      const SOAK = new URLSearchParams(location.search).get('do') === 'soak';
      if (SOAK) {
        let vt = performance.now();
        const p0 = vt, d0 = Date.now();
        performance.now = () => vt;
        Date.now = () => d0 + (vt - p0);
        let q = [];
        window.requestAnimationFrame = (cb) => { q.push(cb); return q.length; };
        window.__tick = (ms) => { vt += ms; const c = q; q = []; for (const f of c) f(vt); };
      }
      window.__TAURI__ = {
        core: {
          invoke: async (cmd, args) => {
            window.__calls.push([cmd, args]);
            switch (cmd) {
              case 'get_config': return { ...config };
              case 'load_model': return loadKurumi();
              case 'load_emoticons': return Promise.all(EMOTICONS.map(async (n) => ({ name: n, data: await toDataUrl(`/emoticons/${encodeURIComponent(n)}.gif`) })));
              case 'pick_model_source': return 'J:/fake/DaL_Kurumi';
              case 'inspect_model': {
                const model = await loadKurumi();
                return { model, info: {
                  name: 'DaL_Kurumi', source: 'J:/fake/DaL_Kurumi', kind: 'folder', geometryFile: 'main.json', textureUnits: [128, 128], bones: 61, cubes: 212,
                  animationFiles: model.animations.map((a, i) => ({ file: i ? 'extra.animation.json' : 'main.animation.json', names: Object.keys(a.animations) })),
                  animationCount: model.animations.reduce((n, a) => n + Object.keys(a.animations).length, 0), authors: ['DaL'],
                  textures: [{ name: 'texture.png', width: 512, height: 512, data: model.texture }, { name: 'alt.png', width: 512, height: 512, data: model.texture }],
                } };
              }
              case 'save_config': return { ...config, ...args.patch };
              case 'load_save':
                if (location.search.includes('nosave')) return null;
                if (SOAK && new URLSearchParams(location.search).get('save')) return (await fetch('/test/' + new URLSearchParams(location.search).get('save'))).json();
                return location.search.includes('gameover')
                  ? { stats: { health: 0, hunger: 0, mood: 40, energy: 50 } }
                  : { stats: { health: 86, hunger: 62, mood: 71, energy: 45 } };
              default: return null;
            }
          },
        },
        event: { listen: async (name, cb) => { listeners[name] = cb; return () => {}; } },
      };
      window.__world = (cursor) => listeners.world?.({ payload: {
        width: innerWidth * devicePixelRatio, height: innerHeight * devicePixelRatio, fullscreen: false,
        cursor: cursor ? [cursor[0] * devicePixelRatio, cursor[1] * devicePixelRatio] : null,
        windows: [{ id: '1', x: 200 * devicePixelRatio, y: 380 * devicePixelRatio, w: 500 * devicePixelRatio, h: 300 * devicePixelRatio, maximized: false }],
      } });
      setInterval(() => window.__world(window.__cursor), 40);
      const errs = [];
      const showErr = (m) => { errs.push(String(m).slice(0, 200)); let d = document.getElementById('__err'); if (!d) { d = document.createElement('pre'); d.id = '__err'; d.style.cssText = 'position:fixed;left:4px;bottom:4px;color:#f55;background:#000c;font:11px monospace;z-index:99999;max-width:90vw;white-space:pre-wrap'; document.body.append(d); } d.textContent = errs.join('\n'); };
      window.addEventListener('error', (e) => showErr(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
      window.addEventListener('unhandledrejection', (e) => showErr('rej: ' + (e.reason?.stack || e.reason)));
      import('/src/renderer/app.js').catch((e) => showErr('import: ' + e.stack));

      // Scenario runner: ui.html?do=menu|modelo|opcoes|size|import|grab
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const byText = (sel, text) => [...document.querySelectorAll(sel)].find((b) => b.textContent.includes(text));
      const petPoint = () => {
        const r = document.getElementById('pet').getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height * 0.62 };
      };
      const fire = (type, p, extra = {}) => window.dispatchEvent(new PointerEvent(type, { clientX: p.x, clientY: p.y, bubbles: true, pointerId: 1, ...extra }));
      const step = new URLSearchParams(location.search).get('do');
      await wait(2500);
      const p = petPoint();
      const app = () => window.__app;
      // Scenarios expect purchases ready at once; ?do=deliver keeps them on the floor.
      if (app() && step !== 'deliver') {
        const g = app().game;
        const buy = g.buy.bind(g);
        g.buy = (id, n) => { const r = buy(id, n); g.deliver(id); return r; };
      }
      const qsStraw = () => location.search.includes('straw');
      if (step === 'eat' || step === 'drink') {
        const item = step === 'eat' ? 'onigiri' : 'matcha_latte';
        const pet = app().pet;
        pet.land(pet.world.surfaces.find((s) => s.id !== 'floor') || pet.world.surfaces[0]);
        app().game.buy(item);
        pet.startGround('idle');
        app().game.use(item);
        if (pet.eating && qsStraw()) pet.eating.straw = true;
        const until = Number(new URLSearchParams(location.search).get('t') || 2.05);
        for (let i = 0; i < until * 60; i++) pet.update(1 / 60);
        await wait(300);
        const e = pet.eating;
        const d = document.createElement('pre');
        d.style.cssText = 'position:absolute;right:4px;top:4px;color:#fff;font:11px monospace';
        d.textContent = JSON.stringify(e ? { t: e.t, raise: e.raise, straw: e.straw, done: e.done, cls: document.querySelector('.held-food').className } : 'no eating');
        document.body.append(d);
      }
      const qs = new URLSearchParams(location.search);
      if (qs.get('theme')) app().setOption('theme', qs.get('theme'));
      // ?do=intro&title=1&nosave=1&stage=title|box|letter|form|burst|off|boot|done
      if (step === 'intro') {
        const stop = qs.get('stage') || 'done';
        const A = app();
        const report = (extra) => {
          const d = document.createElement('pre');
          d.id = '__report';
          d.style.cssText = 'position:fixed;right:4px;top:4px;color:#fff;background:#000a;font:11px monospace;z-index:99999';
          d.textContent = JSON.stringify({ stage: A.intro?.stage ?? 'none', action: A.pet.action, mode: A.pet.mode, offstage: A.pet.offstage, powerOff: A.pet.powerOff,
            owner: A.game.profile.owner, sex: A.game.profile.sex, booted: A.game.profile.booted, name: A.config.name, x: Math.round(A.pet.x), y: Math.round(A.pet.y), css: (({ display, visibility, opacity, transform }) => ({ display, visibility, opacity, transform }))(document.getElementById('pet').style),
            tilt: A.pet.tilt, zoom: A.pet.zoom, squash: A.pet.squash, trail: window.__trail?.filter((t, i, a) => t !== a[i - 1]).join(' '), ...extra });
          document.body.append(d);
        };
        const typeInto = (inp, v) => { inp.value = v; inp.dispatchEvent(new Event('input')); };
        await wait(3000);
        if (stop !== 'title') {
          document.querySelector('.title-item[data-id="new"]')?.click();
          await wait(1200);
          if (stop !== 'box') {
            document.querySelector('.intro-box')?.click();
            await wait(500);
            typeInto(document.querySelector('.intro-sig-input'), 'Haziel');
            if (stop !== 'letter') {
              document.querySelector('.intro-letter .intro-btn').click();
              await wait(1000);
              document.querySelector('.intro-box')?.click();
              await wait(500);
              typeInto(document.querySelector('.intro-form .intro-input'), 'Pixel');
              [...document.querySelectorAll('.intro-sex-btn')][1].click();
              if (stop !== 'form') {
                document.querySelector('.intro-form .intro-btn').click();
                const trail = (window.__trail = []);
                const upd = A.intro.update.bind(A.intro);
                A.intro.update = (dt) => {
                  if (trail.length < 120 && A.intro?.stage === 'falling') trail.push(`${A.pet.action}/${A.pet.mode}@${Math.round(A.pet.x)},${Math.round(A.pet.y)} v${Math.round(A.pet.vx)},${Math.round(A.pet.vy)} dt${dt.toFixed(3)}`);
                  upd(dt);
                };
                await wait(stop === 'burst' ? 1350 : 3800);
                if (stop !== 'burst' && stop !== 'off') {
                  A.intro?.onPetClick();
                  await wait(stop === 'boot' ? 2200 : 9500);
                }
              }
            }
          }
        }
        report();
      }
      // ?do=crow&st=born|idle|head|train|profile|menu|ron|fetch&t=ms
      if (step === 'crow') {
        const A = app();
        const g = A.game;
        const c = A.crow;
        const st = qs.get('st') || 'born';
        g.gear.corvo = true;
        if (st !== 'born') g.profile.crow = { focus: 'pegar', xp: { pegar: 40 }, learned: st === 'fetch' ? ['procurar', 'pegar'] : ['procurar'], trains: 5, gifts: 2, searchAt: Date.now() + 1e9, born: true };
        if (qs.get('nocrow')) g.gear.corvo = false;
        if (qs.get('all')) g.profile.crow.learned = ['procurar', 'pegar', 'vigiar', 'brilhos', 'sorte', 'truques', 'imitar'];
        let tones = 0;
        const tone0 = A.sound.tone.bind(A.sound);
        A.sound.tone = (...a) => { tones++; return tone0(...a); };
        window.__tones = () => tones;
        await wait(1800);
        if (st === 'head') c.toHead();
        if (st === 'train') c.startDuo('treinar', true);
        if (st === 'profile') c.profile(300, 200);
        if (st === 'menu') A.toys.contextMenu('corvo', 300, 200);
        if (st === 'ron') for (let i = 0; i < 13; i++) c.poke();
        if (st === 'trick') { g.profile.crow.learned.push('truques'); c.tricks(true); }
        if (st === 'shiny') { g.profile.crow.learned.push('brilhos'); c.idle(0.1); g.profile.crow.shinyAt = 0; }
        if (st === 'mimic') { g.profile.crow.learned.push('imitar'); c.heard = ((h) => (t, l) => { Math.random = () => 0.1; h.call(c, t, l); })(c.heard); A.speech.say('Hora do lanche, vamos comer!'); }
        if (st === 'doll') {
          g.gear.cristal = true; g.dollAwake = true; g.profile.dollMet = true;
          if (!g.toys.pelucia) { g.queue = g.queue.filter((j) => j.id !== 'pelucia'); g.deliveries.push({ id: 'pelucia', n: 1, x: null, display: null }); g.deliver('pelucia'); }
          g.placeToy('pelucia', c.x + c.P * 1.5, 0);
          await wait(800);
          c.idle(0.1);
          c.withDoll(qs.get('k') || 'perch');
        }
        if (st === 'furn') {
          ['cama', 'estante'].forEach((id, i) => { if (!g.toys[id]) { g.queue = g.queue.filter((j) => j.id !== id); g.deliveries.push({ id, n: 1, x: null, display: null }); g.deliver(id); } g.placeToy(id, innerWidth * (0.55 + i * 0.2), 0); });
          await wait(500);
          c.idle(0.1);
          c.act.then = () => c.toFurniture();
        }
        if (st === 'red') Object.assign(c.canvas.style, { animation: 'crowRon 1s -0.4s paused' });
        if (st === 'fetch' || st === 'print') g.queue.push({ id: 'onigiri', n: 1, t: 0, dur: 0.5 });
        const tl = [];
        for (let left = Number(qs.get('t') || 2500); left > 0; left -= 500) {
          await wait(Math.min(500, left));
          if (st === 'print') tl.push(`${A.pet.action}${A.pet.goal?.run ? '!' : ''}@${Math.round(A.pet.x)}/${A.pet.surfaceId}${A.pet.mini ? 'M' : ''}${g.deliveries.length}`);
        }
        console.log('TL', tl.join(' '));
        const d = document.createElement('pre');
        d.id = '__report';
        d.style.cssText = 'position:fixed;right:4px;top:4px;color:#fff;background:#000a;font:11px monospace;z-index:99999';
        d.textContent = JSON.stringify({ x: Math.round(c.x), y: Math.round(c.y), act: c.act?.kind, perch: c.perch, duo: c.duo?.phase, carry: c.carry.length, inv: g.inventory.onigiri || 0, deliveries: g.deliveries.length, pet: A.pet.action, tl: tl.join(' '), tones, trick: c.trick && `${c.trick.list}:${c.trick.i}`, doll: A.doll?.x != null ? [Math.round(A.doll.x), A.doll.brain.task?.pose, A.doll.alive] : null, bubble: c.bubbleEl?.textContent ?? null, mim: [!!A.speech.crowHooked, c.mimicking, Math.round(c.mimicAt || 0), String(A.speech.say).slice(0, 30), c.learned('imitar'), c.hidden, A.speech.text], snd: [A.sound.enabled, A.sound.ctx?.state, A.sound.crowVol, A.config.sound, A.config.volume], ron: [A.sound.crowRon, A.sound.ron?.size, A.sound.ronLast], data: g.profile.crow });
        document.body.append(d);
      }
      if (step === 'gameboy' || step === 'pat' || step === 'request') {
        const pet = app().pet;
        pet.land(pet.world.surfaces[0]);
        if (step === 'gameboy') {
          app().game.coins = 999;
          app().game.buy('gameboy');
          app().game.buy('cart_pong');
          app().toys.inspecting?.el.remove();
          app().toys.inspecting = null;
          pet.endToy(true);
          pet.startGround('idle');
          app().placeToy('gameboy');
          app().toys.play('gameboy', pet);
        }
        if (step === 'pat') { pet.startGround('idle'); pet.pat(); }
        if (step === 'request') { pet.request = { kind: 'food', id: 'takoyaki', name: 'Takoyaki', img: app().game && (await import('/src/renderer/game.js')).itemById('takoyaki').img, t: 40 }; window.__app.pet.emit('request', pet.request); }
        for (let i = 0; i < 90; i++) pet.update(1 / 60);
        await wait(600);
      }
      const run = (n) => { for (let i = 0; i < n; i++) app().pet.update(1 / 60); };
      if (step === 'gbflow' || step === 'gbbag') {
        const pet = app().pet;
        pet.land(pet.world.surfaces[0]);
        pet.startGround('idle');
        app().game.coins = 999;
        const openMenu = async () => { const q = petPoint(); window.dispatchEvent(new MouseEvent('contextmenu', { clientX: q.x, clientY: q.y, bubbles: true, cancelable: true })); await wait(200); };
        const buyRow = (name) => [...document.querySelectorAll('.item')].find((i) => i.textContent.includes(name))?.querySelector('.buy')?.click();
        await openMenu();
        byText('.cat', 'Shop').click(); await wait(80);
        byText('.seg button', 'Fun').click(); await wait(80);
        buyRow('Game Boy'); await wait(80);
        for (let i = 0; i < 40; i++) { run(15); await wait(10); }
        byText('.cat', 'Invent').click(); await wait(80);
        buyRow('Game Boy'); await wait(80);
        window.__log = { shopAfter: null };
        byText('.cat', 'Shop').click(); await wait(80);
        byText('.seg button', 'Fun').click(); await wait(80);
        window.__log.shopAfter = [...document.querySelectorAll('.item-name')].map((e) => e.textContent);
        if (step === 'gbbag') { buyRow('Pong'); await wait(80); }
        app().view.play && document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
        for (let i = 0; i < 60; i++) { run(15); await wait(10); }
        window.__log.action = pet.action + '/' + pet.toyPlay?.id;
        window.__log.bag = [app().game.bag, app().game.coins, app().game.cartridges.join(','), !!document.querySelector('.toy[data-id="bag"]')];
        if (step === 'gbbag') { document.querySelector('.toy[data-id="bag"]')?.dispatchEvent(new PointerEvent('pointerdown', { button: 0, bubbles: true, pointerId: 5 })); document.querySelector('.toy[data-id="bag"]')?.dispatchEvent(new PointerEvent('pointerup', { button: 0, bubbles: true, pointerId: 5 })); }
        await wait(400);
        const d = document.createElement('pre');
        d.style.cssText = 'position:absolute;right:4px;top:4px;color:#fff;font:11px monospace;max-width:420px;white-space:pre-wrap';
        d.textContent = JSON.stringify(window.__log, null, 1);
        document.body.append(d);
      }
      if (step === 'grabtop') {
        const q = petPoint();
        fire('pointerdown', q, { button: 0 });
        for (let i = 1; i <= 20; i++) { await wait(16); fire('pointermove', { x: q.x, y: q.y - i * 40 }); }
        fire('pointermove', { x: q.x, y: 30 });
        await wait(500);
      }
      if (step === 'qte') {
        app().pet.play();
        window.__cursor = [app().pet.x, app().pet.y - 50];
        await wait(400);
        for (let i = 0; i < 4; i++) { window.dispatchEvent(new KeyboardEvent('keydown', { key: i % 2 ? 'ArrowRight' : 'ArrowLeft' })); await wait(60); }
      }
      if (step === 'ghost') {
        window.dispatchEvent(new MouseEvent('contextmenu', { clientX: p.x, clientY: p.y, bubbles: true, cancelable: true }));
        await wait(300);
        const m = document.querySelector('.menu');
        const r = m.getBoundingClientRect();
        const down = { x: r.left + 150, y: r.top + 200 };
        m.dispatchEvent(new PointerEvent('pointerdown', { clientX: down.x, clientY: down.y, button: 2, bubbles: true, pointerId: 2 }));
        for (let i = 1; i <= 10; i++) { await wait(16); m.dispatchEvent(new PointerEvent('pointermove', { clientX: down.x - i * 25, clientY: down.y - i * 8, bubbles: true, pointerId: 2 })); }
        m.dispatchEvent(new PointerEvent('pointerup', { clientX: down.x - 250, clientY: down.y - 80, bubbles: true, pointerId: 2 }));
        await wait(300);
      }
      if (step === 'grabL' || step === 'grabR') {
        const q = { x: p.x + (step === 'grabL' ? -14 : 14), y: p.y - 10 };
        fire('pointerdown', q, { button: 0 });
        for (let i = 1; i <= 25; i++) { await wait(16); fire('pointermove', { x: q.x + i * 4, y: q.y + 150 + i * 4 }); }
        await wait(600);
      }
      if (step && !['grab', 'grabL', 'grabR', 'gameover', 'eat', 'drink', 'qte', 'ghost', 'gameboy', 'pat', 'request', 'gbflow', 'gbbag', 'grabtop', 'ball', 'hook', 'leave', 'leaveend', 'nomenu', 'versus', 'emotes', 'fx', 'furn', 'tv', 'approach', 'objects', 'pack', 'fun', 'upgrades', 'hd'].includes(step)) {
        window.dispatchEvent(new MouseEvent('contextmenu', { clientX: p.x, clientY: p.y, bubbles: true, cancelable: true }));
        await wait(300);
      }
      if (step === 'perfil') byText('.cat', 'Perfil')?.click();
      if (step === 'temas') byText('.cat', 'Temas')?.click();
      if (step === 'brincar') byText('.cat', 'Brincar')?.click();
      if (step === 'shopfun' || step === 'shopmed') {
        byText('.cat', 'Shop')?.click();
        await wait(100);
        byText('.seg button', step === 'shopfun' ? 'Fun' : 'Medicina')?.click();
      }
      if (step === 'modelo' || step === 'size' || step === 'import') byText('.cat', 'Modelo')?.click();
      if (step === 'opcoes' || step === 'opcoes2') byText('.cat', 'Opções')?.click();
      // ?do=konami: Konami code in Options (debug tab + logs), folding a group, then English.
      if (step === 'konami') {
        byText('.cat', 'Opções')?.click();
        await wait(100);
        const res = { before: !!document.querySelector('.group.debug') };
        for (const k of ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a']) {
          window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
          await wait(20);
        }
        await wait(200);
        res.debug = app().config.debug;
        res.after = !!document.querySelector('.group.debug');
        res.toast = !!document.querySelector('.konami-toast');
        byText('.group', 'Som')?.click();
        await wait(50);
        res.folds = document.querySelectorAll('.group.fold').length;
        res.closed = [...document.querySelectorAll('.group.fold.closed')].map((g) => g.textContent);
        res.saved = app().config.foldedGroups;
        setTimeout(() => { throw new Error('konami-test'); });
        Promise.reject(new Error('konami-reject'));
        await wait(3500);
        res.logs = window.__calls.filter(([c]) => c === 'log_lines').flatMap(([, a]) => a.lines);
        app().setOption('lang', 'en');
        await wait(100);
        res.en = [...document.querySelectorAll('.panel .group')].map((g) => g.textContent).join(' | ');
        const out = document.createElement('pre');
        out.id = '__res';
        out.dataset.noI18n = '';
        out.textContent = JSON.stringify(res, null, 1);
        document.body.append(out);
      }
      if (step === 'opcoes2') { await wait(100); document.querySelector('.panel').scrollTop = 999; }
      if (step === 'shop' || step === 'inventario' || step === 'feed') {
        byText('.cat', 'Shop')?.click();
        await wait(100);
        if (step !== 'shop') {
