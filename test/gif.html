<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">{ "imports": { "three": "/src/renderer/vendor/three.module.js" } }</script>
    <style>html, body { margin: 0; background: #000; } canvas.off { position: absolute; left: -99999px; }</style>
  </head>
  <body>
    <script type="module">
      // Animated GIF of Ninna and Aghata on the clean title screen (test/cover-bg-clean.png). ?v=dance|moods
      // The GIF lands in <pre id="__png"> as a data URL (test/cover.ps1 saves it).
      import { PetView } from '/src/renderer/view.js';
      import { GIFEncoder, quantize, applyPalette } from 'https://unpkg.com/gifenc@1.0.3/dist/gifenc.esm.js';
      const q = new URLSearchParams(location.search);
      const W = Number(q.get('w') || 600), H = Number(q.get('h') || 340), FPS = Number(q.get('fps') || 20);
      const toDataUrl = async (url) => {
        const blob = await (await fetch(url)).blob();
        return new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); });
      };
      const loadImg = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
      const P = 300;
      async function viewFor(dir, yaw) {
        const files = {
          geometry: await (await fetch(`/models/${dir}/main.json`)).json(),
          animations: [await (await fetch(`/models/${dir}/main.animation.json`)).json()],
          texture: await toDataUrl(`/models/${dir}/texture.png`),
        };
        const canvas = document.createElement('canvas'); canvas.className = 'off'; document.body.append(canvas);
        const view = await PetView.create(files, P, canvas);
        view.setPose('stand'); view.setFacing(Math.PI + yaw, true);
        return view;
      }
      // [anim, seconds] segments; each pet can start a segment with a delay so they don't move in lockstep.
      const PLANS = {
        dance: { L: [['extra7', 4]], R: [['extra7', 4]], offset: 0.5 },
        moods: { L: [['extra1', 2.4], ['extra0', 2], ['extra2', 2.4]], R: [['extra2', 2.4], ['extra1', 2.4], ['extra0', 2]], offset: 0 },
      };
      const plan = PLANS[q.get('v') || 'dance'];
      const L = await viewFor('MyPersocon', 0.35), R = await viewFor('Aghata', -0.35);
      const bg = await loadImg('/test/cover-bg-clean.png');
      const out = document.createElement('canvas'); out.width = W; out.height = H;
      const g = out.getContext('2d', { willReadFrequently: true });
      const sw = bg.width * 0.95, sh = sw * H / W, sx = (bg.width - sw) / 2, sy = bg.height * 0.065;

      const total = plan.L.reduce((s, [, d]) => s + d, 0), n = Math.round(total * FPS);
      const segAt = (segs, t) => { let a = 0; for (const s of segs) { if (t < a + s[1]) return [s[0], a]; a += s[1]; } return [segs.at(-1)[0], a]; };
      const cur = new Map();
      const step = (view, segs, t) => {
        const [anim, start] = segAt(segs, Math.max(0, t));
        if (cur.get(view) !== anim + start) { cur.set(view, anim + start); view.play(anim, { restart: true, fade: 0.15 }); }
        view.update(1 / FPS);
      };
      const draw = (view, cx) => {
        const r = view.canvas.width / view.width;
        const y0 = (view.feetY - P * 1.3) * r, y1 = (view.feetY + P * 0.02) * r;
        const tall = H * 0.92, s = tall / (y1 - y0), w = view.canvas.width * s;
        g.save(); g.shadowColor = 'rgba(255, 90, 210, 0.7)'; g.shadowBlur = 10;
        g.drawImage(view.canvas, 0, y0, view.canvas.width, y1 - y0, cx - w / 2, H * 0.97 - tall, w, tall);
        g.restore();
      };
      // Warm-up so hair physics settles before the first recorded frame.
      for (let i = 0; i < FPS; i++) { step(L, plan.L, 0); step(R, plan.R, 0); }
      cur.clear();
      const frames = [];
      for (let i = 0; i < n; i++) {
        const t = i / FPS;
        step(L, plan.L, t); step(R, plan.R, t - plan.offset);
        g.drawImage(bg, sx, sy, sw, sh, 0, 0, W, H);
        draw(L, W * 0.3); draw(R, W * 0.7);
        frames.push(g.getImageData(0, 0, W, H).data);
      }
      const sample = new Uint8ClampedArray(W * H * 4 * 3);
      [0, n / 3, (2 * n) / 3].forEach((k, j) => sample.set(frames[Math.floor(k)], j * W * H * 4));
      const palette = quantize(sample, 255);
      const T = palette.length; palette.push([0, 0, 0]);
      const gif = GIFEncoder();
      let prev = null;
      for (const f of frames) {
        const idx = applyPalette(f, palette.slice(0, T));
        if (prev) {
          const d = idx.slice();
          for (let i = 0; i < d.length; i++) if (idx[i] === prev[i]) d[i] = T;
          gif.writeFrame(d, W, H, { palette, delay: 1000 / FPS, transparent: true, transparentIndex: T, dispose: 1 });
        } else gif.writeFrame(idx, W, H, { palette, delay: 1000 / FPS, repeat: 0 });
        prev = idx;
      }
      gif.finish();
      const bytes = gif.bytes();
      let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      const pre = document.createElement('pre'); pre.id = '__png'; pre.textContent = 'data:image/gif;base64,' + btoa(bin);
      document.body.append(pre);
    </script>
  </body>
</html>
