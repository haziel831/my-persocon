name: Build Linux Alpha

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-alpha-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-alpha-cargo-

      - run: npm ci

      - name: Syntax + cargo check
        env:
          CARGO_TERM_COLOR: never
          RUST_BACKTRACE: 1
        # npm run check prints the full cargo stderr on failure; no piping/truncation here.
        run: npm run check

      - name: Build AppImage + deb
        working-directory: src-tauri
        run: npx tauri build --bundles appimage,deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: My-Persocon-2.2-Linux-Alpha
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
